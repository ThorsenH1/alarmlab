name: Verify research pipeline
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python run.py all --output artifacts/ci
      - run: python scripts/create_notebook.py
      - run: python scripts/verify_artifacts.py --output artifacts/ci
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-python-${{ matrix.python-version }}
          path: artifacts/ci/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            artifacts/browser_verification.json
            demo/preview-*.png
